name: Publish

# Publishes to PyPI on a `v*` tag push, via PyPI Trusted Publishing (no API
# token stored in secrets). One-time setup required before the first tag:
# on pypi.org, under your project (or "pending publisher" if it doesn't exist
# yet) -> Publishing -> add a trusted publisher with:
#   owner: kalininalab   repo: PLMSommelier
#   workflow: publish.yml    environment: release
# `workflow_dispatch` publishes to TestPyPI instead, as a dry run, and needs
# the same setup on test.pypi.org (no `environment` needed there).
#
# If the repo is ever transferred to another owner, the trusted publisher
# above must be re-created under the new owner/repo on both pypi.org and
# test.pypi.org -- it's bound to owner/repo and does not follow a GitHub
# redirect. See RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('plmsommelier/__init__.py').read()).group(1))")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match plmsommelier.__version__ ($PKG_VERSION)" >&2
            exit 1
          fi
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distributions
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke-test-testpypi:
    # Confirms the package that just landed on TestPyPI is actually
    # installable and runnable, not just that `twine check` liked the
    # distribution. TestPyPI doesn't mirror torch and friends, so
    # --extra-index-url pypi.org is required for the install to resolve.
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for the index to catch up
        run: sleep 30
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: |
          pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            plmsommelier
      - run: plmsommelier --help

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
