[build-system]
requires = ["setuptools>=77"]  # PEP 639 license-files support, used below
build-backend = "setuptools.build_meta"

[project]
name = "plmsommelier"
dynamic = ["version"]
description = "Pick the best layer of a protein language model for your dataset, and get back a truncated model."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Roman Joeres" },
    { name = "Ilya Senatorov", email = "il.senatorov@gmail.com" },
]
keywords = ["protein language model", "layer selection", "probing", "esm", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
dependencies = [
    "cyclopts>=3",
    "numpy>=2.1",  # first release with cp313 wheels; older sdists fail to build (distutils removed in 3.12)
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.5",  # transformers>=5.9,<6 disables torch entirely below 2.5
    "transformers>=5.9,<6",
    "sentencepiece>=0.2.1",  # first release with cp312/cp313 wheels
    "protobuf>=3.20",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/kalininalab/PLMSommelier"
Repository = "https://github.com/kalininalab/PLMSommelier"
Issues = "https://github.com/kalininalab/PLMSommelier/issues"
Changelog = "https://github.com/kalininalab/PLMSommelier/blob/main/CHANGELOG.md"
Paper = "https://arxiv.org/abs/2608.12090"

[project.optional-dependencies]
multimolecule = ["multimolecule>=0.2.1"]  # AGPL-3.0; kept out of the MIT core
dev = ["pytest>=7", "pytest-cov", "ruff", "pre-commit", "build", "twine"]

[project.scripts]
plmsommelier = "plmsommelier.cli:main"

[tool.setuptools.packages.find]
include = ["plmsommelier*"]

[tool.setuptools.package-data]
plmsommelier = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "plmsommelier.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "weights: needs model weights downloaded from the HF hub",
    "slow: slow end-to-end test",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
