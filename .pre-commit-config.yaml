default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files   # default 500 kB; keeps model weights/embeddings out

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5                      # matches the ruff pinned in uv.lock
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
